<!DOCTYPE html>
<html lang="zh">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>信</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a1826">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;1,300&family=Barlow+Condensed:wght@100;200&family=Noto+Serif+SC:wght@200;300&display=swap" rel="stylesheet">

<style>
  :root{
    /* 全部取自参考图的实际采样值 */
    --void:#0a1826;        /* 天的底，比参考图抬了一档 */
    --blue:#0d3955;        /* 蓝区 */
    --band:#3a5068;        /* 带的主体 */
    --warm:#59677a;        /* 带里那点暖褐 */
    --bone:#e6ecf3;
    --ash:#93a2b2;
    --whisper:#63717f;
    --star:#f2f7fb;
    --line:rgba(147,162,178,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    position:relative;
    background:var(--void); color:var(--bone);
    font-family:'Noto Serif SC',serif;
    display:flex; justify-content:center;
    overflow-x:hidden; -webkit-font-smoothing:antialiased;
  }

  /* ── 天 ── */
  .sky{
    position:absolute; top:0; left:0; right:0; min-height:100%;
    height:100%; z-index:0; pointer-events:none; overflow:hidden;
  }
  .sky i{position:absolute; inset:-14%; display:block; mix-blend-mode:screen}

  /* 大范围的蓝：铺开，别让四角塌成黑 */
  .sky i:nth-child(1){
    background:
      radial-gradient(ellipse 110% 68% at 16% 78%, rgba(22,74,108,.9), transparent 76%),
      radial-gradient(ellipse 90% 60% at 84% 26%, rgba(16,52,80,.66), transparent 78%),
      radial-gradient(ellipse 130% 90% at 50% 50%, rgba(14,44,70,.5), transparent 82%);
    filter:blur(30px);
    animation:sky1 150s ease-in-out infinite alternate;
  }
  /* 星云带 */
  .sky i:nth-child(2){
    background:linear-gradient(64deg,
      transparent 16%,
      rgba(52,72,96,.5) 31%,
      rgba(66,90,116,.62) 42%,
      rgba(98,112,132,.6) 51%,
      rgba(60,82,108,.56) 60%,
      rgba(40,58,80,.42) 73%,
      transparent 90%);
    filter:blur(22px);
    animation:sky2 118s ease-in-out infinite alternate;
  }
  /* 带里的絮状浓块 */
  .sky i:nth-child(3){
    background:
      radial-gradient(ellipse 22% 13% at 40% 66%, rgba(106,118,136,.52), transparent 64%),
      radial-gradient(ellipse 18% 10% at 52% 52%, rgba(84,100,122,.48), transparent 66%),
      radial-gradient(ellipse 20% 11% at 63% 36%, rgba(68,90,114,.42), transparent 68%),
      radial-gradient(ellipse 15% 9% at 33% 78%, rgba(94,106,124,.38), transparent 66%);
    filter:blur(19px);
    animation:sky3 96s ease-in-out infinite alternate;
  }
  /* 暗尘：只咬带里面，别扩散 */
  .sky i:nth-child(4){
    mix-blend-mode:multiply;
    background:
      radial-gradient(ellipse 11% 7% at 47% 60%, rgba(10,24,38,.6), transparent 62%),
      radial-gradient(ellipse 9% 6% at 57% 44%, rgba(10,24,38,.54), transparent 64%),
      radial-gradient(ellipse 9% 6% at 37% 72%, rgba(10,24,38,.5), transparent 64%);
    filter:blur(15px);
    animation:sky4 104s ease-in-out infinite alternate;
  }
  @keyframes sky1{to{transform:translate(2%,-2%) scale(1.04)}}
  @keyframes sky2{to{transform:translate(-3%,2%) scale(1.05)}}
  @keyframes sky3{to{transform:translate(3%,-2%) scale(1.06)}}
  @keyframes sky4{to{transform:translate(-2%,2%) scale(1.05)}}

  /* ── 星：跟着页面一起滚 ── */
  .stars{
    position:absolute; top:0; left:0; right:0; height:100%;
    z-index:1; pointer-events:none; overflow:hidden;
  }
  .stars i{
    position:absolute; display:block; border-radius:50%;
    background:var(--star);
  }
  .stars i.tw{animation:tw linear infinite}
  @keyframes tw{0%,100%{opacity:var(--o)} 50%{opacity:calc(var(--o) * 2.6)}}

  /* 暗角：只收边缘一点点，不再把中间以外全压黑 */
  .vig{
    position:absolute; top:0; left:0; right:0; height:100%;
    z-index:2; pointer-events:none;
    background:radial-gradient(ellipse 120% 92% at 44% 54%, transparent 68%, rgba(4,12,22,.42) 100%);
  }

  .frame{
    position:relative; z-index:4;
    width:100%; max-width:440px; min-height:100vh;
    padding:calc(30px + env(safe-area-inset-top)) 26px calc(50px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column;
  }

  /* ── 眉标 ── */
  .mast{display:flex; align-items:baseline; margin-bottom:4px}
  .mark{
    font-family:'Barlow Condensed',sans-serif; font-weight:100;
    font-size:11px; letter-spacing:.62em; text-transform:uppercase;
    color:var(--whisper); text-indent:.62em;
  }
  .today-date{
    font-family:'Cormorant',serif; font-style:italic; font-weight:300;
    font-size:12px; letter-spacing:.14em; color:var(--whisper); margin-left:auto;
  }
  .cog{
    margin-left:15px; background:none; border:0; padding:4px 0 4px 4px;
    width:auto; cursor:pointer; line-height:0;
  }
  .cog svg{width:14px; height:14px; opacity:.38; transition:opacity .3s}
  .cog:active svg{opacity:.8}

  /* ── 今天 ── */
  .today{margin-top:44px}
  .letter{
    padding:22px 0; position:relative;
    opacity:0; transform:translateY(10px);
    animation:rise .9s cubic-bezier(.2,.8,.25,1) forwards;
  }
  .letter+.letter{border-top:1px solid var(--line)}
  @keyframes rise{to{opacity:1; transform:none}}

  .meta{display:flex; align-items:center; gap:11px; margin-bottom:12px}
  .slot{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:11.5px; letter-spacing:.42em; color:var(--ash);
    display:inline-flex; align-items:center; gap:9px;
  }
  .slot::before{
    content:''; width:3.5px; height:3.5px; border-radius:50%; flex:none;
    background:var(--star); box-shadow:0 0 7px rgba(242,247,251,.6);
  }
  .at{
    font-family:'Cormorant',serif; font-style:italic; font-weight:300;
    font-size:16px; letter-spacing:.1em; color:#7d8b9b;
  }
  .text{
    font-family:'Noto Serif SC',serif; font-weight:300;
    font-size:15.5px; line-height:2.25; letter-spacing:.06em;
    color:var(--bone); white-space:pre-wrap;
  }

  .pending{
    padding:20px 0; border-top:1px solid var(--line);
    display:flex; align-items:center; gap:12px;
  }
  .pending .slot{opacity:.42}
  .pending .slot::before{box-shadow:none; background:rgba(147,162,178,.5)}
  .pending .hint{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:12.5px; letter-spacing:.08em; color:#5a6673;
  }

  .empty{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:14px; line-height:2.2; color:var(--ash); padding:10px 0 0;
  }

  /* ── 控制区 ── */
  .controls{margin-top:46px; padding-top:22px; border-top:1px solid var(--line)}
  .status{
    font-family:'Barlow Condensed',sans-serif; font-weight:100;
    font-size:10.5px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--whisper); margin-bottom:14px; text-indent:.3em;
  }
  button{
    width:100%; padding:13px;
    background:transparent; color:var(--ash);
    border:1px solid var(--line); border-radius:1px;
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:13px; letter-spacing:.24em; text-indent:.24em;
    cursor:pointer; transition:border-color .3s, color .3s;
  }
  button:active{border-color:rgba(147,162,178,.42); color:var(--bone)}
  button+button{margin-top:8px}
  .tiny{
    margin-top:14px; font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:11.5px; line-height:1.9; color:#5e6a78;
  }

  /* ── 往前 ── */
  .past{margin-top:48px; flex:1}
  .past-label{
    font-family:'Barlow Condensed',sans-serif; font-weight:100;
    font-size:10px; letter-spacing:.56em; text-transform:uppercase;
    color:var(--whisper); margin-bottom:20px;
  }
  .day{padding:18px 0; border-bottom:1px solid var(--line)}
  .day:last-child{border-bottom:0}
  .day .d{
    font-family:'Cormorant',serif; font-style:italic; font-weight:300;
    font-size:13px; letter-spacing:.12em; color:#6d7b8a; margin-bottom:10px;
  }
  .day .one{margin:8px 0; display:flex; gap:11px; align-items:baseline}
  .day .one .w{
    font-family:'Cormorant',serif; font-style:italic; font-size:11.5px;
    color:#5a6673; letter-spacing:.1em; flex:none; min-width:34px;
  }
  .day .one .t{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:13px; line-height:2; letter-spacing:.05em; color:#a4b1bf;
    white-space:pre-wrap;
  }
  .none{font-family:'Noto Serif SC',serif; font-weight:200; font-size:13px; color:var(--whisper)}
  .more{
    margin-top:18px; color:var(--whisper);
    font-size:12px; letter-spacing:.3em; text-indent:.3em;
    border-style:dashed;
  }

  /* ── 抽屉：跟外面同一片天 ── */
  .sheet{
    position:fixed; inset:0; z-index:20;
    background:rgba(2,5,10,.8);
    backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .35s ease;
  }
  .sheet.open{opacity:1; pointer-events:auto}
  .panel{
    position:relative; width:100%; max-width:440px;
    background:linear-gradient(168deg, rgba(13,40,62,.94), rgba(5,10,18,.97));
    border-top:1px solid rgba(147,162,178,.22);
    padding:26px 26px calc(30px + env(safe-area-inset-bottom));
    transform:translateY(16px); transition:transform .35s cubic-bezier(.2,.8,.25,1);
    max-height:88vh; overflow-y:auto;
  }
  .sheet.open .panel{transform:none}
  /* 抽屉自己的几颗星 */
  .panel .dust{position:absolute; inset:0; pointer-events:none; overflow:hidden}
  .panel .dust i{position:absolute; border-radius:50%; background:var(--star)}
  .panel > *:not(.dust){position:relative; z-index:1}

  .panel h3{
    font-family:'Barlow Condensed',sans-serif; font-weight:100;
    font-size:10px; letter-spacing:.56em; text-transform:uppercase;
    color:var(--whisper); margin-bottom:8px;
  }
  .src{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:11.5px; color:#6b7787; margin-bottom:18px;
  }
  .panel textarea{
    width:100%; min-height:132px; resize:vertical;
    background:rgba(2,6,12,.6); color:#c6d2de;
    border:1px solid var(--line); border-radius:1px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11.5px; line-height:1.75; padding:12px;
    margin-bottom:12px;
  }
  .panel textarea:focus{outline:0; border-color:rgba(147,162,178,.36)}
  .panel textarea::placeholder{color:#454f5d}
  .panel .divider{height:1px; background:var(--line); margin:22px 0}
  .msg{
    font-family:'Noto Serif SC',serif; font-weight:200;
    font-size:12px; line-height:1.9; margin-top:12px; min-height:19px;
  }
  .msg.ok{color:#8fb8c6}
  .msg.bad{color:#c09098}

  @media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="sky"><i></i><i></i><i></i><i></i></div>
<div class="stars" id="stars"></div>
<div class="vig"></div>

<div class="frame">

  <header class="mast">
    <span class="mark">Une lettre</span>
    <span class="today-date" id="todayDate"></span>
    <button class="cog" id="cog" aria-label="内容">
      <svg viewBox="0 0 16 16" fill="none" stroke="#93a2b2" stroke-width=".9">
        <circle cx="8" cy="8" r="2.2"/>
        <path d="M8 1.4v2M8 12.6v2M14.6 8h-2M3.4 8h-2M12.7 3.3l-1.4 1.4M4.7 11.3l-1.4 1.4M12.7 12.7l-1.4-1.4M4.7 4.7L3.3 3.3"/>
      </svg>
    </button>
  </header>

  <section class="today" id="today"></section>

  <section class="controls">
    <div class="status" id="status">检查中</div>
    <button id="enable">开启提醒</button>
    <button id="test">现在试一条</button>
    <div class="tiny" id="tiny"></div>
  </section>

  <section class="past">
    <div class="past-label">往前</div>
    <div id="pastList"><div class="none">还没有。</div></div>
    <button id="more" class="more" style="display:none">更早的</button>
  </section>

</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div class="dust" id="dust"></div>
    <h3>内容</h3>
    <div class="src" id="srcLine"></div>

    <textarea id="box" placeholder="把内容粘在这里。&#10;JSON 或者 messages.js 那种写法都行。"></textarea>

    <button id="doAppend">追加 · 接在现有内容后面</button>
    <button id="doImport">导入 · 整份换掉</button>
    <button id="doExport">导出 · 复制到剪贴板</button>
    <div class="msg" id="msg"></div>

    <div class="divider"></div>
    <button id="closeSheet">关上</button>
  </div>
</div>

<script src="./messages.js"></script>
<script>
const $ = id => document.getElementById(id);

/* ── 星空：多、细、暗。沿着带更密 ── */
(function(){
  let seed = 20260812;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;

  // 带的走向：左上 → 右下偏，跟 CSS 里 64deg 那条对齐
  const bandX = t => 20 + t * 62;
  const bandY = t => 6 + t * 88;

  let html = '';
  const put = (x, y, size, opacity, twinkle) => {
    if(x < -1 || x > 101 || y < -1 || y > 101) return;
    const dur = (6 + rnd() * 11).toFixed(1);
    const delay = (rnd() * 16).toFixed(1);
    html += `<i class="${twinkle ? 'tw' : ''}" style="left:${x.toFixed(2)}%;top:${y.toFixed(2)}%;` +
            `width:${size}px;height:${size}px;--o:${opacity};opacity:${opacity};` +
            (twinkle ? `animation-duration:${dur}s;animation-delay:${delay}s` : '') + `"></i>`;
  };

  // 带里：密集的细星
  for(let i = 0; i < 300; i++){
    const t = rnd();
    const spread = 17 + rnd() * 13;
    const x = bandX(t) + (rnd() - 0.5) * spread;
    const y = bandY(t) + (rnd() - 0.5) * spread * 0.5;
    const big = rnd() > 0.92;
    put(x, y,
        big ? (1.2 + rnd()*0.8).toFixed(2) : (0.55 + rnd()*0.55).toFixed(2),
        big ? (0.5 + rnd()*0.26).toFixed(2) : (0.2 + rnd()*0.3).toFixed(2),
        rnd() > 0.76);
  }
  // 带外：稀一些，但要够亮，别让暗区发死
  for(let i = 0; i < 230; i++){
    const big = rnd() > 0.94;
    put(rnd()*100, rnd()*100,
        big ? (1.1 + rnd()*0.7).toFixed(2) : (0.5 + rnd()*0.5).toFixed(2),
        big ? (0.44 + rnd()*0.24).toFixed(2) : (0.15 + rnd()*0.26).toFixed(2),
        rnd() > 0.8);
  }
  $('stars').innerHTML = html;

  // 页面比一屏长的时候，把星补到下面去
  function fillDown(){
    const box = $('stars');
    const h = document.body.scrollHeight;
    const vh = window.innerHeight;
    if(h <= vh * 1.15) return;
    const screens = Math.ceil(h / vh);
    if(box.dataset.screens === String(screens)) return;
    box.dataset.screens = screens;
    let extra = '';
    for(let sIdx = 1; sIdx < screens; sIdx++){
      for(let i = 0; i < 120; i++){
        const big = rnd() > 0.94;
        const size = big ? (1.1 + rnd()*0.7).toFixed(2) : (0.5 + rnd()*0.5).toFixed(2);
        const op = big ? (0.4 + rnd()*0.22).toFixed(2) : (0.14 + rnd()*0.24).toFixed(2);
        const topPx = (sIdx * vh + rnd() * vh).toFixed(0);
        const dur = (6 + rnd()*11).toFixed(1);
        const delay = (rnd()*16).toFixed(1);
        const tw = rnd() > 0.8;
        extra += `<i class="${tw?'tw':''}" style="left:${(rnd()*100).toFixed(2)}%;top:${topPx}px;` +
                 `width:${size}px;height:${size}px;--o:${op};opacity:${op};` +
                 (tw ? `animation-duration:${dur}s;animation-delay:${delay}s` : '') + `"></i>`;
      }
    }
    box.insertAdjacentHTML('beforeend', extra);
  }
  window.addEventListener('load', fillDown);
  window.addEventListener('resize', fillDown);
  window.__fillStars = fillDown;

  // 抽屉里几颗，让它跟外面是同一片天
  let d = '';
  for(let i = 0; i < 26; i++){
    const s2 = (0.5 + rnd()*0.7).toFixed(2);
    d += `<i style="left:${(rnd()*100).toFixed(1)}%;top:${(rnd()*100).toFixed(1)}%;` +
         `width:${s2}px;height:${s2}px;opacity:${(0.08+rnd()*0.2).toFixed(2)}"></i>`;
  }
  $('dust').innerHTML = d;
})();

/* ── 时间：一律按福州（UTC+8），跟设备时区无关 ── */
const TZ_OFFSET = 8 * 60;
function fzNow(){
  const now = new Date();
  return new Date(now.getTime() + (now.getTimezoneOffset() + TZ_OFFSET) * 60000);
}
const pad = n => String(n).padStart(2,'0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const prettyOf = s => { const [y,m,d] = s.split('-'); return `${y}.${m}.${d}`; };
const parseKey = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const toHM  = m => pad(Math.floor(m/60)) + ':' + pad(m%60);

/* 稳定随机：同一个种子永远同一个数 */
function seeded(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 15; h = Math.imul(h, 2246822507);
  h ^= h >>> 13; h = Math.imul(h, 3266489909);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}

/* ── 内容来源：本地导入的优先 ── */
const CUSTOM = 'letters.custom';
function readCustom(){
  try{
    const raw = localStorage.getItem(CUSTOM);
    if(!raw) return null;
    const o = JSON.parse(raw);
    return (o && o.MESSAGES) ? o : null;
  }catch(e){ return null; }
}
function readGlobals(){
  const c = readCustom();
  const S0 = (typeof SLOTS !== 'undefined') ? SLOTS : (window.SLOTS || {});
  const D0 = (typeof START_DATE !== 'undefined') ? START_DATE : (window.START_DATE || null);
  if(c) return { M:c.MESSAGES, S:c.SLOTS || S0, D:c.START_DATE || D0, custom:true };
  return {
    M: (typeof MESSAGES !== 'undefined') ? MESSAGES : (window.MESSAGES || {}),
    S: S0, D: D0, custom:false
  };
}

/* ── 今天的几条 ── */
function planFor(dateKey){
  const {M, S, D} = readGlobals();
  if(!D) return [];
  const days = Math.round((parseKey(dateKey) - parseKey(D)) / 86400000);
  if(days < 0) return [];

  const out = [];
  for(const name of Object.keys(S)){
    const list = M[name], slot = S[name];
    if(!Array.isArray(list) || !slot || days >= list.length) continue;
    const [lo, hi] = slot.range.map(toMin);
    const at = lo + Math.floor(seeded(dateKey + ':' + name) * (hi - lo + 1));
    out.push({ name, label: slot.label, at: toHM(at), atMin: at, text: list[days] });
  }
  return out.sort((a,b) => a.atMin - b.atMin);
}

/* ── 存档 ── */
const STORE = 'letters.seen.v2';
function readSeen(){
  try{ return JSON.parse(localStorage.getItem(STORE) || '{}'); }catch(e){ return {}; }
}
function writeSeen(o){
  try{ localStorage.setItem(STORE, JSON.stringify(o)); }catch(e){}
}

/* ── 渲染 ── */
var pastExpanded = false;

function syncToSW(){
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller) return;
  const {M, S, D} = readGlobals();
  navigator.serviceWorker.controller.postMessage({ type:'sync-data', M, S, D });
}

function render(){
  syncToSW();
  const now = fzNow();
  const k = keyOf(now);
  const nowMin = now.getHours()*60 + now.getMinutes();

  $('todayDate').textContent = prettyOf(k);

  const plan = planFor(k);
  const arrived = plan.filter(p => p.atMin <= nowMin);
  const waiting = plan.filter(p => p.atMin >  nowMin);

  if(arrived.length){
    const seen = readSeen();
    seen[k] = arrived.map(p => ({ label:p.label, at:p.at, text:p.text }));
    writeSeen(seen);
  }

  const box = $('today');
  box.innerHTML = '';

  if(!plan.length){
    box.innerHTML = '<div class="empty">今天这里是空的。<br>不是没人来过，是还没写到这一天。</div>';
  } else {
    arrived.forEach((p, i) => {
      const el = document.createElement('div');
      el.className = 'letter';
      el.style.animationDelay = (i * 0.12) + 's';
      el.innerHTML = '<div class="meta"><span class="slot"></span><span class="at"></span></div><div class="text"></div>';
      el.querySelector('.slot').textContent = p.label;
      el.querySelector('.at').textContent = p.at;
      el.querySelector('.text').textContent = p.text;
      box.appendChild(el);
    });

    if(!arrived.length){
      const el = document.createElement('div');
      el.className = 'empty';
      el.textContent = '今天的还没到。';
      box.appendChild(el);
    }

    waiting.forEach(p => {
      const el = document.createElement('div');
      el.className = 'pending';
      el.innerHTML = '<span class="slot"></span><span class="hint">还没到</span>';
      el.querySelector('.slot').textContent = p.label;
      box.appendChild(el);
    });
  }

  // 往前
  const seen = readSeen();
  const past = Object.keys(seen).filter(d => d !== k).sort().reverse();
  const LIMIT = 3;
  const shown = pastExpanded ? past : past.slice(0, LIMIT);

  const moreBtn = $('more');
  if(past.length > LIMIT){
    moreBtn.style.display = 'block';
    moreBtn.textContent = pastExpanded ? '收起' : '更早的（还有 ' + (past.length - LIMIT) + ' 天）';
  } else {
    moreBtn.style.display = 'none';
  }

  if(past.length){
    $('pastList').innerHTML = '';
    shown.forEach(d => {
      const day = document.createElement('div');
      day.className = 'day';
      const head = document.createElement('div');
      head.className = 'd';
      head.textContent = prettyOf(d);
      day.appendChild(head);
      (seen[d] || []).forEach(item => {
        const one = document.createElement('div');
        one.className = 'one';
        one.innerHTML = '<span class="w"></span><span class="t"></span>';
        one.querySelector('.w').textContent = item.at;
        one.querySelector('.t').textContent = item.text;
        day.appendChild(one);
      });
      $('pastList').appendChild(day);
    });
  }
}

$('more').addEventListener('click', () => {
  pastExpanded = !pastExpanded;
  render();
  if(window.__fillStars) setTimeout(window.__fillStars, 50);
});

/* ── Service Worker ── */
let reg = null;

async function boot(){
  if(!('serviceWorker' in navigator)){
    $('status').textContent = '这个浏览器不支持后台唤醒';
    return;
  }
  try{
    reg = await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;
    syncToSW();
    refreshStatus();
    scheduleToday();
  }catch(err){
    $('status').textContent = '注册失败';
    $('tiny').textContent = err.message;
  }
}

async function refreshStatus(){
  const perm = ('Notification' in window) ? Notification.permission : 'unsupported';
  const hasPeriodic = reg && 'periodicSync' in reg;
  let registered = false;
  if(hasPeriodic){
    try{
      const tags = await reg.periodicSync.getTags();
      registered = tags.includes('daily-letter');
    }catch(e){}
  }
  const installed = window.matchMedia('(display-mode: standalone)').matches
                 || window.navigator.standalone === true;

  let s, tip;
  if(perm !== 'granted'){
    s = '还没开启'; tip = '点上面那个按钮。';
  } else if(registered){
    s = '已开启 · 后台唤醒中';
    tip = '系统会定期叫醒它，但时间由系统定，不一定准点。页面开着的时候是准的。';
  } else if(!installed){
    s = '已开启 · 未装到桌面';
    tip = '现在是浏览器标签页，后台唤醒用不了。菜单里选「添加到手机」，从桌面图标进来再点一次。';
  } else if(!hasPeriodic){
    s = '已开启 · 打开时送达';
    tip = '这台设备不支持后台唤醒，提醒会在你打开时补上。内容一条都不会少。';
  } else {
    s = '已开启 · 页面开着时准时';
    tip = '系统还没批准后台唤醒，多用几天有时会通过。在那之前：只要这个页面开过、还没被系统清掉，到点就会弹；清掉了也不丢，下次打开会补上。';
  }
  $('status').textContent = s;
  $('tiny').textContent = tip;
}

$('enable').addEventListener('click', async () => {
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ $('status').textContent = '通知权限没给'; return; }
    if(!reg) await boot();

    if(reg && 'periodicSync' in reg){
      try{
        const st = await navigator.permissions.query({name:'periodic-background-sync'});
        if(st.state === 'granted'){
          await reg.periodicSync.register('daily-letter', { minInterval: 4*60*60*1000 });
        }
      }catch(e){}
    }
    if(reg && 'sync' in reg){
      try{ await reg.sync.register('check-letter'); }catch(e){}
    }
    refreshStatus();
    scheduleToday();
  }catch(err){
    $('status').textContent = '出错';
    $('tiny').textContent = err.message;
  }
});

$('test').addEventListener('click', async () => {
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ $('status').textContent = '通知权限没给'; return; }
  if(!reg) await boot();

  const now = fzNow();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const arrived = planFor(keyOf(now)).filter(p => p.atMin <= nowMin);
  const last = arrived[arrived.length-1];

  await reg.showNotification('有一条', {
    body: last ? last.text.slice(0,70) : '打开看看。',
    tag: 'letter-test',
    icon: './icon-192.png',
    badge: './icon-mono.png'
  });
});


/* ── 定时器兜底 ──
 * 系统还没批准后台唤醒时，靠这个：
 * 页面打开过一次，就给今天剩下的每一条各挂一个定时器。
 * 只要浏览器进程还活着，到点就弹。关掉就没了 —— 但内容不会丢，下次打开会补上。
 */
let timers = [];

function clearTimers(){
  timers.forEach(t => clearTimeout(t));
  timers = [];
}

function sentKeyLocal(id){
  try{
    const o = JSON.parse(localStorage.getItem('letters.notified') || '{}');
    return !!o[id];
  }catch(e){ return false; }
}
function markSentLocal(id){
  try{
    const o = JSON.parse(localStorage.getItem('letters.notified') || '{}');
    o[id] = 1;
    // 只留最近 60 条，别无限长
    const keys = Object.keys(o).sort();
    while(keys.length > 60) delete o[keys.shift()];
    localStorage.setItem('letters.notified', JSON.stringify(o));
  }catch(e){}
}

async function popNow(p, dateKey){
  const id = dateKey + '_' + p.name;
  if(sentKeyLocal(id)) return;
  if(!reg) return;
  if(!('Notification' in window) || Notification.permission !== 'granted') return;
  try{
    await reg.showNotification('有一条', {
      body: p.text.length > 80 ? p.text.slice(0,80) + '…' : p.text,
      tag: 'letter-' + id,
      icon: './icon-192.png',
      badge: './icon-mono.png'
    });
    markSentLocal(id);
  }catch(e){}
}

function scheduleToday(){
  clearTimers();
  if(!('Notification' in window) || Notification.permission !== 'granted') return;

  const now = fzNow();
  const dateKey = keyOf(now);
  const nowMs = now.getHours()*3600000 + now.getMinutes()*60000 + now.getSeconds()*1000;

  planFor(dateKey).forEach(p => {
    const targetMs = p.atMin * 60000;
    const delay = targetMs - nowMs;

    if(delay <= 0){
      // 已经过了：如果还没通知过，立刻补一条
      popNow(p, dateKey);
    } else if(delay < 12 * 3600000){
      timers.push(setTimeout(() => {
        popNow(p, dateKey);
        render();
      }, delay));
    }
  });
}

/* ── 抽屉 ── */
const sheet = $('sheet');

function describeSource(){
  const c = readCustom();
  if(!c) return '现在用的是网页自带的内容。';
  const n = Object.keys(c.MESSAGES || {})
    .reduce((sum,k) => sum + (Array.isArray(c.MESSAGES[k]) ? c.MESSAGES[k].length : 0), 0);
  return '现在用的是你自己的内容，共 ' + n + ' 条。';
}
function openSheet(){
  $('srcLine').textContent = describeSource();
  $('msg').textContent = '';
  sheet.classList.add('open');
}
function closeSheet(){ sheet.classList.remove('open'); }

$('cog').addEventListener('click', openSheet);
$('closeSheet').addEventListener('click', closeSheet);
sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });

function say(text, ok){
  const n = $('msg');
  n.textContent = text;
  n.className = 'msg ' + (ok ? 'ok' : 'bad');
}

function parseBox(){
  const raw = $('box').value.trim();
  if(!raw){ say('框里是空的。', false); return null; }

  let obj = null;
  try{
    obj = JSON.parse(raw);
  }catch(e){
    try{
      const fn = new Function(raw + ';return {' +
        'MESSAGES: typeof MESSAGES!=="undefined"?MESSAGES:null,' +
        'SLOTS: typeof SLOTS!=="undefined"?SLOTS:null,' +
        'START_DATE: typeof START_DATE!=="undefined"?START_DATE:null};');
      obj = fn();
    }catch(e2){
      say('这段读不出来。检查一下逗号和引号。', false);
      return null;
    }
  }

  if(obj && !obj.MESSAGES){
    if(Object.values(obj).some(v => Array.isArray(v))) obj = { MESSAGES: obj };
  }
  if(!obj || !obj.MESSAGES){ say('没找到消息。', false); return null; }
  if(!Object.keys(obj.MESSAGES).some(k => Array.isArray(obj.MESSAGES[k]))){
    say('里面没有任何数组。', false); return null;
  }
  return obj;
}

function saveCustom(data){
  try{ localStorage.setItem(CUSTOM, JSON.stringify(data)); return true; }
  catch(e){ say('存不进去，可能内容太大了。', false); return false; }
}
function countOf(M){
  return Object.keys(M).reduce((n,k) => n + (Array.isArray(M[k]) ? M[k].length : 0), 0);
}

$('doImport').addEventListener('click', () => {
  const obj = parseBox();
  if(!obj) return;
  if(!saveCustom({
    START_DATE: obj.START_DATE || null,
    SLOTS: obj.SLOTS || null,
    MESSAGES: obj.MESSAGES
  })) return;
  say('换好了，现在共 ' + countOf(obj.MESSAGES) + ' 条。', true);
  $('box').value = '';
  $('srcLine').textContent = describeSource();
  render();
  scheduleToday();
});

$('doAppend').addEventListener('click', () => {
  const obj = parseBox();
  if(!obj) return;

  const {M, S, D} = readGlobals();
  const merged = {};
  Object.keys(M).forEach(k => { merged[k] = Array.isArray(M[k]) ? M[k].slice() : M[k]; });

  let added = 0;
  Object.keys(obj.MESSAGES).forEach(k => {
    const incoming = obj.MESSAGES[k];
    if(!Array.isArray(incoming)) return;
    if(!Array.isArray(merged[k])) merged[k] = [];
    merged[k] = merged[k].concat(incoming);
    added += incoming.length;
  });

  if(!saveCustom({
    START_DATE: obj.START_DATE || D || null,
    SLOTS: obj.SLOTS || S || null,
    MESSAGES: merged
  })) return;
  say('加上了 ' + added + ' 条，现在共 ' + countOf(merged) + ' 条。', true);
  $('box').value = '';
  $('srcLine').textContent = describeSource();
  render();
  scheduleToday();
});

$('doExport').addEventListener('click', async () => {
  const {M, S, D} = readGlobals();
  const text = JSON.stringify({ START_DATE: D, SLOTS: S, MESSAGES: M }, null, 2);
  try{
    await navigator.clipboard.writeText(text);
    say('复制好了，粘到记事本存着。', true);
  }catch(e){
    $('box').value = text;
    say('复制不了，内容放框里了，自己长按选中。', true);
  }
});

render();
boot();
if(window.__fillStars) setTimeout(window.__fillStars, 60);

document.addEventListener('visibilitychange', () => {
  if(!document.hidden){ render(); scheduleToday(); }
});
setInterval(render, 60000);
</script>
