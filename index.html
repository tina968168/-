<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推送订阅</title>

<style>
  :root{
    --bg:#0e1016; --card:#161a24; --line:#2a3040;
    --text:#e4e0d6; --dim:#8a8f9c;
    --ok:#7fc8a0; --bad:#d98a8a; --warn:#d9c48a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;
    padding:24px 18px 60px; line-height:1.7;
    display:flex; flex-direction:column; align-items:center;
  }
  .wrap{width:100%; max-width:440px}
  h1{font-size:19px; font-weight:600; margin-bottom:4px}
  .sub{font-size:13px; color:var(--dim); margin-bottom:20px}

  .step{
    background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:12px;
  }
  .step h2{
    font-size:14px; font-weight:600; margin-bottom:4px;
    display:flex; align-items:center; gap:8px;
  }
  .num{
    width:20px; height:20px; border-radius:50%; flex:none;
    background:#2a3040; color:var(--dim);
    font-size:11px; display:flex; align-items:center; justify-content:center;
  }
  .num.done{background:#2d4a3a; color:#a8dcc0}
  .step p{font-size:12.5px; color:var(--dim); margin-bottom:10px}

  button{
    width:100%; padding:13px;
    background:#252c3c; color:var(--text);
    border:1px solid var(--line); border-radius:9px;
    font-size:14px; font-family:inherit; cursor:pointer;
  }
  button:active{background:#2e3648}
  button:disabled{opacity:.35}
  button.copy{margin-top:8px; background:#1d2432; font-size:13px; padding:10px}

  .out{
    margin-top:10px; padding:10px 11px;
    background:#0a0c11; border:1px solid var(--line); border-radius:7px;
    font-family:ui-monospace,monospace; font-size:10.5px; line-height:1.6;
    color:#9fb3c8; word-break:break-all; white-space:pre-wrap;
    max-height:200px; overflow:auto; display:none;
  }
  .out.show{display:block}
  .label{font-size:10.5px; color:#5f6674; text-transform:uppercase; letter-spacing:.1em; margin:9px 0 3px}

  .note{
    margin-top:6px; font-size:12px; color:var(--warn);
    background:#241f14; border:1px solid #3d3520; border-radius:7px;
    padding:9px 11px; display:none;
  }
  .note.show{display:block}
  .err{color:#e0a8a8; background:#2a1a1a; border-color:#4a2d2d}
</style>

<div class="wrap">
  <h1>推送订阅</h1>
  <div class="sub">这一步不用注册任何账号。目标是拿到一串订阅地址。</div>

  <div class="step">
    <h2><span class="num" id="n1">1</span>生成密钥对</h2>
    <p>一公一私。公钥给浏览器用，私钥以后给服务器用，别给别人看。</p>
    <button id="gen">生成</button>
    <div class="out" id="keys"></div>
    <button class="copy" id="copyKeys" style="display:none">复制两把钥匙</button>
    <div class="note" id="note1"></div>
  </div>

  <div class="step">
    <h2><span class="num" id="n2">2</span>订阅</h2>
    <p>用公钥向浏览器换一个专属地址。这个地址只属于你这台手机上的这个网页。</p>
    <button id="sub" disabled>订阅</button>
    <div class="out" id="subOut"></div>
    <button class="copy" id="copySub" style="display:none">复制订阅信息</button>
    <div class="note" id="note2"></div>
  </div>

  <div class="step">
    <h2><span class="num" id="n3">3</span>存好</h2>
    <p>把整理出来的这一段复制到记事本存着。下一步配 Cloudflare 要用。</p>
    <button id="showAll" disabled>把要保存的东西整理出来</button>
    <div class="out" id="allOut"></div>
    <button class="copy" id="copyAll" style="display:none">全部复制</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function b64urlToU8(s){
  const pad = '='.repeat((4 - s.length % 4) % 4);
  const b64 = (s + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(b64);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
function u8ToB64url(u8){
  let s = '';
  for(const b of u8) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

let PUB = '', PRIV = '', SUBSCRIPTION = null;

function showNote(el, msg, isErr){
  el.textContent = msg;
  el.className = 'note show' + (isErr ? ' err' : '');
}

$('gen').addEventListener('click', async () => {
  try{
    const pair = await crypto.subtle.generateKey(
      { name:'ECDSA', namedCurve:'P-256' }, true, ['sign','verify']
    );
    const rawPub = new Uint8Array(await crypto.subtle.exportKey('raw', pair.publicKey));
    const jwkPriv = await crypto.subtle.exportKey('jwk', pair.privateKey);

    PUB  = u8ToB64url(rawPub);
    PRIV = jwkPriv.d;

    $('keys').className = 'out show';
    $('keys').innerHTML =
      '<div class="label">公钥 public</div>' + PUB +
      '<div class="label">私钥 private（保密）</div>' + PRIV;

    $('n1').className = 'num done';
    $('n1').textContent = '✓';
    $('copyKeys').style.display = 'block';
    $('sub').disabled = false;
    showNote($('note1'), '生成好了。私钥别发到任何公开的地方，包括聊天记录和 GitHub。', false);
  }catch(err){
    showNote($('note1'), '生成失败：' + err.message, true);
  }
});

$('sub').addEventListener('click', async () => {
  try{
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      showNote($('note2'), '通知权限没给，订阅不了。', true);
      return;
    }

    const reg = await navigator.serviceWorker.register('./sw.js');
    await navigator.serviceWorker.ready;

    const old = await reg.pushManager.getSubscription();
    if(old) await old.unsubscribe();

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64urlToU8(PUB)
    });

    SUBSCRIPTION = sub.toJSON();

    $('subOut').className = 'out show';
    $('subOut').innerHTML =
      '<div class="label">endpoint</div>' + SUBSCRIPTION.endpoint +
      '<div class="label">p256dh</div>' + SUBSCRIPTION.keys.p256dh +
      '<div class="label">auth</div>' + SUBSCRIPTION.keys.auth;

    $('n2').className = 'num done';
    $('n2').textContent = '✓';
    $('copySub').style.display = 'block';
    $('showAll').disabled = false;
    showNote($('note2'), '成功了。endpoint 里带 fcm.googleapis.com 说明走的是安卓的推送通道，正常。', false);
  }catch(err){
    showNote($('note2'), '订阅失败：' + err.name + ' — ' + err.message, true);
  }
});

function bundle(){
  return JSON.stringify({
    vapidPublic: PUB,
    vapidPrivate: PRIV,
    subscription: SUBSCRIPTION
  }, null, 2);
}

$('showAll').addEventListener('click', () => {
  $('allOut').className = 'out show';
  $('allOut').textContent = bundle();
  $('n3').className = 'num done';
  $('n3').textContent = '✓';
  $('copyAll').style.display = 'block';
});

async function copy(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    const t = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent=t, 1500);
  }catch(e){
    alert('复制失败，长按上面的文字手动选中吧');
  }
}
$('copyKeys').addEventListener('click', e => copy('public: '+PUB+'\nprivate: '+PRIV, e.target));
$('copySub').addEventListener('click',  e => copy(JSON.stringify(SUBSCRIPTION,null,2), e.target));
$('copyAll').addEventListener('click',  e => copy(bundle(), e.target));
</script>
